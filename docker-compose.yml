  iis-sandbox:
    image: clemhen/iis-sandbox:deployable-v1.5
    container_name: iis-sandbox-iggy
    env_file:
      - .env
    environment:
      FHIR_VERSION: R4
      #      IIS_MYSQL_URL: "jdbc:mysql://iis-sandbox-mysql:3306/iis_alongside_jpa"
      IIS_MYSQL_URL: "jdbc:h2:mem:iis"
      SPRING_DATASOURCE_URL: "jdbc:postgresql://hapi-fhir-postgresql:5432/hapi_fhir_iis"
    restart: unless-stopped
    ports:
      - 19056:8080
    #    volumes:
    #      - iis-h2-data:/data-h2
    depends_on:
      hapi-fhir-postgresql:
        condition: service_healthy
