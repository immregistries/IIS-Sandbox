services:
  hapi-fhir-postgresql:
    image: postgres:13-alpine
    container_name: hapi-fhir-postgres-jojo
    restart: unless-stopped
    env_file:
      - .env
    environment:
      #      Postgres DB name should be changed when trying to switch between FHIR version
      POSTGRES_DB: ${ENV_IIS_POSTGRES_DB}
      POSTGRES_USER: ${ENV_IIS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${ENV_IIS_POSTGRES_PASSWORD}
    healthcheck:
      test: pg_isready -d $$POSTGRES_DB -U $$POSTGRES_USER
      interval: 8s
      timeout: 10s
      retries: 10
      start_period: 5s
