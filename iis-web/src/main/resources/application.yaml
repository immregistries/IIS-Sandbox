## Prod profile only properties to set up with postgresql
## Dev profile only properties to set up with H2
---
spring:
  config.activate.on-profile: prod
  jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgres94Dialect
---
spring:
  config.activate.on-profile: h2
  datasource:
    username: sa
    password: null
    driverClassName: org.h2.Driver
  jpa.properties.hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirH2Dialect