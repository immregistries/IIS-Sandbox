#Used for all profiles
#Profiles for prod or h2 at the bottom

spring.config.import: optional:file:.env[.properties]
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
server:
  servlet:
    contextPath: ${ENV_CONTEXT_PATH:/iis}
iis:
  deployment:
    url:
      host: "localhost:8080"
    admin:
      user: ${IIS_ADMIN_USER:"change-me"}
      password: ${IIS_ADMIN_PASSWORD:"change-me"}
  api:
    app:
      jwtSecret: ${ENV_IIS_JWT_SECRET}
      jwtExpirationMs: 3600000

  cds:
    #    Configuration on CDS Engines connections, currently does not support
    default_connection: localhost-lonestar
    default_ice_connection: localhost-ice
    connections:
      - name: sabbia-lonestar
        url: "https://sabbia.westus2.cloudapp.azure.com/lonestar/forecast"
        service: "lsvf"
      - name: sabbia-ice
        url: "https://sabbia.westus2.cloudapp.azure.com/opencds-decision-support-service/evaluate"
        service: "ice"
      - name: localhost-lonestar
        url: "https://localhost:8089/lonestar/forecast"
        service: "LSVF"
      - name: localhost-ice
        url: "https://localhost:8089/opencds-decision-support-service/evaluate"
        service: "ice"
spring:
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${ENV_IIS_GITHUB_CLIENT_ID}
            client-secret: ${ENV_IIS_GITHUB_CLIENT_SECRET}
            scope: read:user,user:email
#            token-uri: https://api.github.com/login/oauth/access_token
#            authorization-uri: https://api.github.com/login/oauth/authorize
#            user-info-uri: https://api.github.com/user
  profiles:
    active: '@spring.profiles.active@'
  main:
    allow-circular-references: true
    #allow-bean-definition-overriding: true
  flyway:
    enabled: false
    check-location: false
    baselineOnMigrate: true
  second-datasource:
    jdbc-url: ${IIS_MYSQL_URL}
    username: ${ENV_IIS_MYSQL_USER}
    password: ${ENV_IIS_MYSQL_PASSWORD}
    max-active: 50
    hikari:
      maximum-pool-size: 10
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${ENV_IIS_POSTGRES_USER}
    password: ${ENV_IIS_POSTGRES_PASSWORD}
    #    driver-class-name: org.postgresql.Driver
    # rest is Handled in spring profiles
    max-active: 50
    # database connection pool size
    hikari:
      maximum-pool-size: 10

  jpa:
    properties:
      hibernate.format_sql: false
      hibernate.show_sql: false
      #Hibernate dialect is automatically detected except Postgres and H2.
      #If using H2, then supply the value of ca.uhn.fhir.jpa.model.dialect.HapiFhirH2Dialect
      #If using postgres, then supply the value of ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgres94Dialect
      #      hibernate.dialect: '@jpa.properties.hibernate.dialect@'
      hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirH2Dialect
      #      hibernate.dialect: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgres94Dialect
  #      hibernate.hbm2ddl.auto: update
  #      hibernate.jdbc.batch_size: 20
  #      hibernate.cache.use_query_cache: false
  #      hibernate.cache.use_second_level_cache: false
  #      hibernate.cache.use_structured_entries: false
  #      hibernate.cache.use_minimal_puts: false
  ###    These settings will enable fulltext search with lucene
      hibernate.search.enabled: true
  #      hibernate.search.backend.type: lucene
  #      hibernate.search.backend.analysis.configurer: ca.uhn.fhir.jpa.search.HapiLuceneAnalysisConfigurer
  #      hibernate.search.backend.directory.type: local-filesystem
  #      hibernate.search.backend.directory.root: target/lucenefiles
  #      hibernate.search.backend.lucene_version: lucene_current
  batch:
    job:
      enabled: false
hibernate:
  hbm2ddl:
    auto:
      create
hapi:
  fhir:
    ### This is the FHIR version. Choose between, DSTU2, DSTU3, R4 or R5
    #    HERE R4 selected by default, can be modified with environment variable FHIR_VERSION, OnCondition classes were modified for this override
    fhir_version: ${FHIR_VERSION:R4}

    ### This enables the swagger-ui at /fhir/swagger-ui/index.html as well as the /fhir/api-docs (see https://hapifhir.io/hapi-fhir/docs/server_plain/openapi.html)
#    openapi_enabled: true

    ### enable to use the ApacheProxyAddressStrategy which uses X-Forwarded-* headers
    ### to determine the FHIR server address
    #   use_apache_address_strategy: false
    ### forces the use of the https:// protocol for the returned server address.
    ### alternatively, it may be set using the X-Forwarded-Proto header.
    #   use_apache_address_strategy_https: false
    ### enable to set the Server URL
    #    server_address: http://hapi.fhir.org/baseR4
    #    defer_indexing_for_codesystems_of_size: 101
    #    install_transitive_ig_dependencies: true
    #    implementationguides:
    ###    example from registry (packages.fhir.org)
    #      swiss:
    #        name: swiss.mednet.fhir
    #        version: 0.8.0
    #      example not from registry
    #      ips_1_0_0:
    #        url: https://build.fhir.org/ig/HL7/fhir-ips/package.tgz
    #        name: hl7.fhir.uv.ips
    #        version: 1.0.0
    #    supported_resource_types:
    #      - Patient
    #      - Observation
    #    allow_cascading_deletes: true
    #    allow_contains_searches: true
    #    allow_external_references: true
    #    allow_multiple_delete: true
    #    allow_override_default_search_params: true
    #    auto_create_placeholder_reference_targets: false
    #    cql_enabled: true
    #    default_encoding: JSON
    #    default_pretty_print: true
    default_page_size: 100
    #    delete_expunge_enabled: true
    #    enable_repository_validating_interceptor: false
    enable_index_missing_fields: true
    #    enable_index_of_type: true
    #    enable_index_contained_resource: false
    ###  !!Extended Lucene/Elasticsearch Indexing is still an experimental feature, expect some features (e.g. _total=accurate) to not work as expected!!
    ###  more information here: https://hapifhir.io/hapi-fhir/docs/server_jpa/elastic.html
    advanced_lucene_indexing: false
    #    enforce_referential_integrity_on_delete: false
    # This is an experimental feature, and does not fully support _total and other FHIR features.
    #    enforce_referential_integrity_on_delete: false
    #    enforce_referential_integrity_on_write: false
    #    etag_support_enabled: true
    #    expunge_enabled: true
    #    daoconfig_client_id_strategy: null
    #    client_id_strategy: ALPHANUMERIC
    #    fhirpath_interceptor_enabled: false
    #    filter_search_enabled: true
    #    graphql_enabled: true
    #    narrative_enabled: true
    #    local_base_urls:
    #      - https://hapi.fhir.org/baseR4
    logical_urls:
      - http://terminology.hl7.org/*
      - https://terminology.hl7.org/*
      - http://snomed.info/*
      - https://snomed.info/*
      - http://unitsofmeasure.org/*
      - https://unitsofmeasure.org/*
      - http://loinc.org/*
      - https://loinc.org/*
    mdm_enabled: true
    mdm_rules_json_location: "mdm-rules.json"
    partitioning:
      allow_references_across_partitions: false
      partitioning_include_in_search_hashes: false
      conditional_create_duplicate_identifiers_enabled: true
      request_tenant_partitioning_mode: true
    cors:
      allow_Credentials: true
      # These are allowed_origin patterns, see: https://docs.spring.io/spring-framework/docs/current/javadoc-api/org/springframework/web/cors/CorsConfiguration.html#setAllowedOriginPatterns-java.util.List-
      allowed_origin:
        - '*'

    # Search coordinator thread pool sizes
    search-coord-core-pool-size: 20
    search-coord-max-pool-size: 100
    search-coord-queue-capacity: 200

    # Threadpool size for BATCH'ed GETs in a bundle.
    #    bundle_batch_pool_size: 10
    #    bundle_batch_pool_max_size: 50

    #    logger:
    #      error_format: 'ERROR - ${requestVerb} ${requestUrl}'
